name: "Go coverage report"
on:
  pull_request:
  push:
    branches:
      # Must run for the default branch!
      - main

# The reusable workflow comments on the pull request and pushes the coverage
# notes with GITHUB_TOKEN; it needs these permissions granted by the caller.
permissions: {}

jobs:
  coverage:
    permissions:
      pull-requests: write
      contents: write
    uses: giantswarm/github-workflows/.github/workflows/go-coverage.yaml@main
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"
